plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.9.25'
}

android {
    namespace 'ai.mlc.mlcllm'
    compileSdk 36

    defaultConfig {
        minSdk 26
        ndk {
            abiFilters "arm64-v8a"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            // This tells Gradle where the pre-built .so files live.
            // DO NOT also add this via settings.gradle flatDir — that is a different mechanism.
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
    packaging {
        jniLibs {
            // REQUIRED: prevents Gradle from compressing .so files inside the APK.
            // Compressed .so files cannot be directly dlopen'd on Android.
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation 'org.slf4j:slf4j-nop:2.0.16'
    implementation libs.androidx.core.ktx
    implementation libs.kotlinx.serialization.json
    implementation libs.kotlinx.coroutines.android
}